<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-card">
        <h2>Send A Message</h2>
        <form action="https://api.web3forms.com/submit" method="post">
            <input type="hidden" name="access_key" value="a275389a-1518-4b58-82cd-07508043852a">
            <div class="input-box">
                <label for="username">Name:</label>
                <input type="text" id="username" name="username" placeholder="Your name" required>
            </div>
            <div class="input-box">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Your email" required>
            </div>
            <div class="input-box">
                <label for="phone">Phone Number:</label>
                <input type="tel" name="message" rows="4" placeholder="Your phone number" required>
            </div>
            <div class="input-box">
                <label for="message">Message:</label>
                <textarea id="message" id="username" name="username" placeholder="Your message" required></textarea>
            </div>

            <button type="submit" class="btn">Submit</button>
        </form>
    </div>
</body>
</html>
